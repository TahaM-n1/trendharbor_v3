name: trendharbor_v2
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  go_router: ^12.0.0 # For navigation
  flutter_svg: ^2.0.7 # For SVG icons
  shared_preferences: ^2.2.2
  firebase_core: ^2.32.0  
  firebase_auth: ^4.17.9
  fluttertoast: ^8.2.8
  cloud_firestore: ^4.9.0
  firebase_storage: ^11.5.0
  image_picker: ^1.0.4
  provider: ^6.0.5
  intl: ^0.18.0
  firebase_messaging: ^14.6.5
  easypaisa_flutter: ^1.0.3
  http: ^1.1.0
  cached_network_image: ^3.4.0
  fl_chart: ^0.63.0
  video_player: ^2.9.5
  visibility_detector: ^0.4.0+2
  video_thumbnail: ^0.5.6
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/user1.png
    - assets/user2.png
    - assets/user3.png
    - assets/post1.jpg
