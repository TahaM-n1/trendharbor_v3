name: trendharbor_v2
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  go_router: ^12.0.0 # For navigation
  flutter_svg: ^2.0.7 # For SVG icons
  shared_preferences: ^2.2.2
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  fluttertoast: ^8.2.12
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5
  image_picker: ^1.0.4
  provider: ^6.0.5
  intl: ^0.18.0
  firebase_messaging: ^15.2.5
  easypaisa_flutter: ^1.0.3
  http: ^1.1.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/user1.png
    - assets/user2.png
    - assets/user3.png
    - assets/post1.jpg
    - assets/post2.jpg
    - assets/post3.jpg
    - assets/product1.jpg
    - assets/product2.jpg
    - assets/product3.jpg
    - assets/TH_logo.png
